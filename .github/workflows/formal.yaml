name: formal

on:
  push:
    paths:
      - 'hw/**'
      - 'isa/**'
      - 'formal/**'
      - 'flow/**'
      - '.github/workflows/formal.yaml'
  pull_request:
    paths:
      - 'hw/**'
      - 'isa/**'
      - 'formal/**'
      - 'flow/**'
      - '.github/workflows/formal.yaml'
  workflow_dispatch:

# Four jobs, each with its own setup, so they run in parallel. Each has a 30-minute limit.
#   proofs:   SymbiYosys proofs and covers.
#   decoder:  the exhaustive decoder check (Cyclesim test and Verilator).
#   mutants:  every kill-check (mutants of the netlists).
#   hostlink: the unbounded host-link slices (abc pdr) and lemmas (about 4 minutes), BMC to 72 cycles,
#             the cover, the negative hold check, the default hostlink mutants and the slice mutants.
# The estimate for a 2-core runner is 17 to 26 minutes for the whole run, so a single job
# with a 20-minute limit is not safe; the split keeps each job well inside 30 minutes.

jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Set up OCaml (caches ~/.opam)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0

      - name: Cache dune build
        uses: actions/cache@v4
        with:
          path: _build
          key: dune-proofs-${{ hashFiles('hw/**', 'isa/**', 'formal/**', 'polyglot.opam') }}
          restore-keys: dune-proofs-

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f polyglot.opam.locked ]; then
            opam install . --deps-only --with-test --locked
          else
            opam install . --deps-only --with-test
          fi

      - name: Set up OSS CAD Suite (pinned release)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-17'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Verilog and run the proofs
        shell: bash
        run: |
          make -C formal prove OPAM_EXEC="opam exec --"

  decoder:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Set up OCaml (caches ~/.opam)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f polyglot.opam.locked ]; then
            opam install . --deps-only --with-test --locked
          else
            opam install . --deps-only --with-test
          fi

      - name: Set up OSS CAD Suite (pinned release, for Verilator)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-17'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the decoder check (Cyclesim and Verilator)
        shell: bash
        run: |
          make -C formal decode OPAM_EXEC="opam exec --"

  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Set up OCaml (caches ~/.opam)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f polyglot.opam.locked ]; then
            opam install . --deps-only --with-test --locked
          else
            opam install . --deps-only --with-test
          fi

      - name: Set up OSS CAD Suite (pinned release)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-17'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Verilog and run every kill-check
        shell: bash
        run: |
          make -C formal mutants OPAM_EXEC="opam exec --"

  hostlink:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Set up OCaml (caches ~/.opam)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f polyglot.opam.locked ]; then
            opam install . --deps-only --with-test --locked
          else
            opam install . --deps-only --with-test
          fi

      - name: Set up OSS CAD Suite (pinned release)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: '2026-11-17'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Host-link BMC, cover, negative check and mutants
        shell: bash
        run: |
          make -C formal hostlink OPAM_EXEC="opam exec --"
